services:

  # ─── 1. Nodo Hyperledger Besu ──────────────────────────────────
  besu:
    image: hyperledger/besu:latest
    container_name: besu-node
    restart: always
    ports:
      - "8545:8545"
    volumes:
      - ./data:/opt/besu/data
    command:
      - --network=dev
      - --data-path=/opt/besu/data
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,TXPOOL
      - --host-allowlist=*

  # ─── 2. Base de datos PostgreSQL para Blockscout ───────────────
  blockscout-db:
    image: postgres:15-alpine
    container_name: blockscout-db
    restart: always
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - blockscout-db-data:/var/lib/postgresql/data

  # ─── 3. Redis (cache requerido por Blockscout v6) ──────────────
  blockscout-redis:
    image: redis:7-alpine
    container_name: blockscout-redis
    restart: always

  # ─── 4. Backend indexador de Blockscout ────────────────────────
  blockscout-backend:
    image: blockscout/blockscout:latest
    container_name: blockscout-backend
    restart: always
    depends_on:
      - blockscout-db
      - blockscout-redis
      - besu
    ports:
      - "4000:4000"
    command:
      - sh
      - -c
      - |
        bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()"
        bin/blockscout start
    environment:
      ETHEREUM_JSONRPC_VARIANT: "besu"
      ETHEREUM_JSONRPC_HTTP_URL: "http://besu:8545"
      ETHEREUM_JSONRPC_TRACE_URL: "http://besu:8545"
      DATABASE_URL: "postgresql://postgres:postgrespassword@blockscout-db:5432/blockscout?ssl=false"
      REDIS_URL: "redis://blockscout-redis:6379"
      ECTO_USE_SSL: "false"
      NETWORK: "Ecuador SSI Besu Network"
      SUBNETWORK: "Devnet Local"
      CHAIN_ID: "1337"
      COIN: "ETH"
      COIN_NAME: "ETH"
      SHOW_PRICE_CHART: "false"
      SHOW_TXS_PER_SECOND: "true"
      DISABLE_EXCHANGE_RATES: "true"
      SECRET_KEY_BASE: "ecuador_ssi_secret_key_base_replace_in_prod"
      PORT: "4000"
      BLOCKSCOUT_HOST: "localhost"
      BLOCKSCOUT_PROTOCOL: "http"
      API_V1_READ_METHODS_DISABLED: "false"
      API_V1_WRITE_METHODS_DISABLED: "false"
      # Frontend separado
      NEXT_PUBLIC_API_HOST: "localhost"
      NEXT_PUBLIC_API_PROTOCOL: "http"
      NEXT_PUBLIC_API_BASE_PATH: "/"

  # ─── 5. Frontend visual de Blockscout ──────────────────────────
  blockscout-frontend:
    image: ghcr.io/blockscout/frontend:latest
    container_name: blockscout-frontend
    restart: always
    depends_on:
      - blockscout-backend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_HOST: "localhost"
      NEXT_PUBLIC_API_PORT: "4000"
      NEXT_PUBLIC_API_PROTOCOL: "http"
      NEXT_PUBLIC_API_BASE_PATH: "/"
      NEXT_PUBLIC_APP_HOST: "localhost"
      NEXT_PUBLIC_APP_PROTOCOL: "http"
      NEXT_PUBLIC_APP_PORT: "3001"
      NEXT_PUBLIC_NETWORK_NAME: "Ecuador SSI Besu Network"
      NEXT_PUBLIC_NETWORK_SHORT_NAME: "Besu"
      NEXT_PUBLIC_NETWORK_ID: "1337"
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: "Ether"
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: "ETH"
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
      NEXT_PUBLIC_IS_TESTNET: "true"

volumes:
  blockscout-db-data: